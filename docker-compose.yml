services:
  auth-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${OPEN_MT2_IMAGE:-open-mt2:local}"
    pull_policy: "${OPEN_MT2_PULL_POLICY:-missing}"
    container_name: auth-server
    networks:
      - server
    env_file:
      - ./.env
    restart: always
    ports:
      - "${AUTH_SERVER_PORT}:${AUTH_SERVER_PORT}"
    environment:
      AUTH_SERVER_PORT: "${AUTH_SERVER_PORT}"
      AUTH_SERVER_ADDRESS: "0.0.0.0"
      LOG_LEVEL: "${LOG_LEVEL}"
      DB_PORT: "${DB_PORT}"
      DB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      AUTH_DB_DATABASE_NAME: "${AUTH_DB_DATABASE_NAME}"
      DB_USER: "${DB_USER}"
      CACHE_PORT: "${CACHE_PORT}"
      DB_HOST: database
      CACHE_HOST: cache
      NODE_ENV: production
    depends_on:
      cache:
        condition: service_healthy
      database:
        condition: service_healthy
    command: ["node", "dist/auth/main.js"]
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: "1"

  game-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${OPEN_MT2_IMAGE:-open-mt2:local}"
    pull_policy: "${OPEN_MT2_PULL_POLICY:-missing}"
    container_name: game-server
    env_file:
      - ./.env
    restart: always
    ports:
      - "${GAME_SERVER_PORT}:${GAME_SERVER_PORT}"
    networks:
      - server
    environment:
      GAME_SERVER_PORT: "${GAME_SERVER_PORT}"
      GAME_SERVER_ADDRESS: "0.0.0.0"
      REAL_SERVER_ADDRESS: "${GAME_SERVER_ADDRESS}"
      LOG_LEVEL: "${LOG_LEVEL}"
      DB_PORT: "${DB_PORT}"
      DB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      GAME_DB_DATABASE_NAME: "${GAME_DB_DATABASE_NAME}"
      DB_USER: "${DB_USER}"
      CACHE_PORT: "${CACHE_PORT}"
      DB_HOST: database
      CACHE_HOST: cache
      NODE_ENV: production
    depends_on:
      cache:
        condition: service_healthy
      database:
        condition: service_healthy
    command: ["node", "--max-old-space-size=2048", "dist/game/main.js"]
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2"

  cache:
    # `redis:*-alpine` publishes linux/arm64v8, unlike some legacy tags.
    image: "${CACHE_IMAGE:-redis:7-alpine}"
    restart: unless-stopped
    container_name: cache
    networks:
      - server
    env_file:
      - ./.env
    ports:
      - "${CACHE_PORT}:${CACHE_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    # The stock `mysql:5.7` image has no linux/arm64 build; 8.0 does and is the
    # closest drop-in replacement. Override with DB_IMAGE=mariadb:11 if you
    # prefer MariaDB (Armbian ships it as a native package).
    image: "${DB_IMAGE:-mysql:8.0}"
    container_name: database
    restart: always
    networks:
      - server
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_ROOT_HOST: '%'
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dbdata: {}

networks:
  server:
    name: server
    driver: bridge