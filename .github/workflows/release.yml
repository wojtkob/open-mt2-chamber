name: Release Build

# Autobuild of the installable package and of the container image.
#
# open-mt2 has no native addons, so the compiled output is architecture neutral
# and one build serves every platform. The arm64 job still runs the real thing
# under QEMU to prove the image and the package work on AArch64.
#
# Two automatic behaviours:
#   * every push to master builds everything, uploads the packages as artifacts
#     and pushes :latest to ghcr.io;
#   * a tag push (v*) additionally publishes a GitHub release with both
#     packages and their checksums attached.

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # Required to push the multi-arch image to ghcr.io; without it the build fails
  # at the push step with "installation not allowed to Create organization package".
  packages: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Build and verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor: the quests use Promise.withResolvers, which older
        # runtimes lack. See src/core/util/nodeVersion.ts.
        node: ['22', '24']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check, compile and copy runtime assets
        run: npm run build

      - name: Verify the compiled tree is complete
        run: npm run verify:dist

      - name: Run unit tests
        run: npm run test:unit

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-node${{ matrix.node }}
          path: dist/
          retention-days: 7

  package:
    name: Package for ARM64/AArch64
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build the release tarball
        run: npm ci --ignore-scripts --no-audit --no-fund && bash deploy/build-arm64.sh --arch aarch64

      - name: Upload the installable package
        uses: actions/upload-artifact@v4
        with:
          name: open-mt2-arm64
          path: release/*.tar.gz*
          retention-days: 30

  package-x64:
    name: Package for x86_64
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build the release tarball
        run: npm ci --ignore-scripts --no-audit --no-fund && bash deploy/build-arm64.sh --arch x86_64

      - name: Upload the installable package
        uses: actions/upload-artifact@v4
        with:
          name: open-mt2-x64
          path: release/*.tar.gz*
          retention-days: 30

  smoke-arm64:
    name: ARM64 smoke test (QEMU)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image natively for linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: open-mt2:arm64-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the migrator on AArch64
        run: |
          set -euo pipefail
          container=$(docker run -d --name open-mt2-ci open-mt2:arm64-ci \
            sh -c 'while true; do sleep 3600; done')
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          # The image only has to prove that the compiled tree loads and that the
          # migrator is reachable on AArch64; MySQL/Redis are provided by the
          # compose services in the integration job.
          docker exec open-mt2-ci node -e '
            require("/opt/open-mt2/dist/auth/Container.js");
            require("/opt/open-mt2/dist/game/Container.js");
            const RuntimePaths = require("/opt/open-mt2/dist/core/infra/config/RuntimePaths.js").default;
            for (const dir of ["attr", "spawn"]) {
              if (!RuntimePaths.hasDataDir(dir)) throw new Error("missing data dir: " + dir);
            }
            console.log("arm64 container OK: assets resolved from " + RuntimePaths.appRoot());
          '

  docker:
    name: Container image (multi-arch)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push linux/amd64 + linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish the GitHub release
    # A release is only cut once every autobuild job is green, so a broken build
    # can never be published. Dispatching this workflow with a tag as the ref
    # (github.ref becomes refs/tags/vX) republishes that tag without a new push.
    needs: [package, package-x64, smoke-arm64, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download the ARM64 package
        uses: actions/download-artifact@v4
        with:
          name: open-mt2-arm64
          path: release

      - name: Download the x86_64 package
        uses: actions/download-artifact@v4
        with:
          name: open-mt2-x64
          path: release

      - name: Verify the checksums before publishing
        run: |
          set -euo pipefail
          cd release
          ls -l
          for sum in ./*.tar.gz.sha256; do
            sha256sum --check "$sum"
          done

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} - Metin2 server for ARM64 (Pine A64) and x86_64
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.tar.gz.sha256
          body: |
            ## Pine A64 / ARM64 quick start

            Requires **Node.js >= 22** on the target board. Armbian often ships an
            older `nodejs` package; `deploy/install.sh` adds the NodeSource
            repository when that happens.

            ```bash
            tar -xzf open-mt2-*-aarch64.tar.gz
            cd open-mt2-*-aarch64
            sudo ./deploy/install.sh
            ```

            The installer provisions MariaDB/Redis, creates the `openmt2`
            account, installs and starts `open-mt2-auth.service` and
            `open-mt2-game.service`, and can apply the database schema for you
            (`--skip-deps`, `--skip-migrate`, `--no-start`, `--prefix` are
            available; see `deploy/README.txt`).

            Both archives are architecture neutral - the same `dist/` tree serves
            ARM64 and x86_64. Verify a download with the matching `.sha256` file.

            Container alternative, multi-arch (`linux/amd64`, `linux/arm64`):

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            Full instructions: [docs/arm64.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/arm64.md)
