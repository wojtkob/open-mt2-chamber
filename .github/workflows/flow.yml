name: CI Pipeline

# Gate for every push and pull request. It must fail on a problem, never fix it:
# `npm run format` and `npm run lint:fix` rewrite files, so using them here would
# report success on code that is not committed.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22 is the runtime floor, see src/core/util/nodeVersion.ts.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check Prettier
        run: npm run format:check

      - name: Run Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify the compiled tree is complete
        run: npm run verify:dist

      - name: Check the deployment kit
        run: |
          bash -n deploy/install.sh
          bash -n deploy/uninstall.sh
          bash -n deploy/build-arm64.sh

      - name: Run Tests with Coverage
        run: npm run test:coverage

      - name: Upload Coverage Report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
